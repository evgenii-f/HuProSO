# Inpainting with the reverse process of DPoser (run(method="inpaint"), hp.models.inpainting.dposer_inpaint) on DPoser
# trained like RSGM c10 (c10 data, 30k steps), with two objectives: mean MPVPE (minimized) and APD (maximized). The
# search space of rsgm_inpaint_mean_apd_* (steps, resample, replace, EDM grid) with guidance 10 times larger (0.1-3
# instead of 0.01-0.5): DPoser's coordinates are z-scored axis-angle, not radians, and its DPS needs a 10-20 times
# larger step (smoke test on 100 validation poses). As many trials as the RSGM studies (60, raised to 120 with
# --n-trials). Smoke test, replacement + guidance 0.5, r = 5: 87.60 / 47.52 / APD 6.61.
# Rule for the test, fixed before it (the same as of rsgm_inpaint_mean_apd_*): among the points of the front with APD
# not lower than that of D-Flow with Heun EDM 50 of small std c10 on the same 1000 validation poses (6.40 cm), take
# the one with the lowest mean; if there is none, report that, and take the point with the highest APD of the front.
model: ~/data/experiments/dposer_posedflow_rsgm_budget_s10/run_0001
method: inpaint
objective: mean_apd
poses: 1000
n_trials: 60
params:
  steps: [100, 200, 400]
  guidance: {low: 0.1, high: 3.0, log: true}
  resample: [1, 2, 3, 5]
  replace: [true, false]
fixed:
  schedule: edm
first:  # the best points of the smoke test
  - {steps: 200, guidance: 0.5, resample: 5, replace: true}
  - {steps: 200, guidance: 1.0, resample: 1, replace: false}
  - {steps: 200, guidance: 2.0, resample: 5, replace: false}
  - {steps: 200, guidance: 0.5, resample: 1, replace: true}
  - {steps: 400, guidance: 0.5, resample: 5, replace: true}
