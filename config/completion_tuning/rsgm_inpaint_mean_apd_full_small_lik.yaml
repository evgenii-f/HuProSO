# Inpainting with the reverse process of RSGM (run(method="inpaint"), hp.models.inpainting), network small (512 x 4)
# with the likelihood weighting, trained on the full data for 30k steps: next to rsgm_inpaint_mean_apd_full_small, the
# weighting alone. Two objectives, mean MPVPE (minimized) and APD (maximized); the search space, first trials, poses
# and seeds of rsgm_inpaint_mean_apd_*.
# Rule for the test, fixed before it (the same as of rsgm_inpaint_mean_apd_*): among the points of the front with APD
# not lower than that of D-Flow with Heun EDM 50 of small std c10 on the same 1000 validation poses (6.40 cm), take
# the one with the lowest mean; if there is none, report that, and take the point with the highest APD of the front.
model: ~/data/experiments/full/rsgm_posedflow_small_lik_s10/run_0001
method: inpaint
objective: mean_apd
poses: 1000
n_trials: 120
params:
  steps: [100, 200, 400]
  guidance: {low: 0.01, high: 0.5, log: true}
  resample: [1, 2, 3, 5]
  replace: [true, false]
fixed:
  schedule: edm
first:  # the best points of the smoke test
  - {steps: 200, guidance: 0.1, resample: 1, replace: false}
  - {steps: 200, guidance: 0.2, resample: 1, replace: false}
  - {steps: 200, guidance: 0.2, resample: 5, replace: false}
  - {steps: 200, guidance: 0.2, resample: 5, replace: true}
  - {steps: 200, guidance: 0.05, resample: 1, replace: true}
