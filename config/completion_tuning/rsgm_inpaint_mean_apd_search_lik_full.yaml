# Inpainting with the reverse process of RSGM (run(method="inpaint"), hp.models.inpainting), network search lik
# full (1536 x 6, likelihood weighting, all frames), with two objectives: mean MPVPE (minimized) and APD (maximized),
# the trade-off of accuracy and diversity. The best
# denoiser of ours in the hybrid diagnostic (docs/experiments/2026-11-13_pose_completion_rsgm_vs_dposer.md, section 6);
# the likelihood weighting helped SDS and hurt D-Flow, and inpainting is in between. The same search space as
# rsgm_inpaint_mean_apd_{deep,residual,norm}.
# Rule for the test, fixed before it: among the points of the front with APD not lower than that of D-Flow with Heun
# EDM 50 of small std c10 on the same 1000 validation poses (6.40 cm, 93.33 / 52.43 mm; dflow_valid.py on
# workstation2), take the one with the lowest mean; if there is none, report that, and take the point with the highest
# APD of the front.
model: ~/data/experiments/full/rsgm_posedflow_search_lik_s10/run_0001
method: inpaint
objective: mean_apd
poses: 1000
n_trials: 60
params:
  steps: [100, 200, 400]
  guidance: {low: 0.01, high: 0.5, log: true}
  resample: [1, 2, 3, 5]
  replace: [true, false]
fixed:
  schedule: edm
first:  # the best points of the smoke test
  - {steps: 200, guidance: 0.1, resample: 1, replace: false}
  - {steps: 200, guidance: 0.2, resample: 1, replace: false}
  - {steps: 200, guidance: 0.2, resample: 5, replace: false}
  - {steps: 200, guidance: 0.2, resample: 5, replace: true}
  - {steps: 200, guidance: 0.05, resample: 1, replace: true}
