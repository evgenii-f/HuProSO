# D-Flow (run(method="dflow"), Heun EDM 50) on RSGM fact_RDW (c10, 30k x 4096; residual, dropout 0.1, width 1024),
# rarity sampling weights, beta = 3.3: one of the six fronts of the data-weighting study (three methods x beta 0 and
# 3.3; beta 3.3 chosen by the lowest D-Flow mean on 300 validation poses among the beta grid,
# explore/evaluation/data_weighting). Two objectives: mean MPVPE (minimized) and APD (maximized). The search space,
# first trials, poses and seeds of rsgm_dflow_mean_apd_full_dposer_like, the same for both beta, so the two fronts
# differ only by the sampling of the training poses.
model: ~/data/experiments/data_weighting/rsgm_posedflow_rdw_b3.3_s10/run_0001
method: dflow
objective: mean_apd
poses: 1000
n_trials: 60
params:
  lr: {low: 0.01, high: 0.3, log: true}
  running_weight: {low: 1.0e-5, high: 0.1, log: true}
  steps: [50, 100, 200, 300]
fixed:
  ode_steps: 25
  sampler: heun
  schedule: edm
first:
  - {lr: 0.1, running_weight: 0.001, steps: 200}  # their protocol (at 50 network calls)
  - {lr: 0.1, running_weight: 0.001, steps: 50}
  - {lr: 0.03, running_weight: 0.001, steps: 100}
