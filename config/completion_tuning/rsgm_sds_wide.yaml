# DPoser's optimization (score distillation) on RSGM 512x4 c10, a wide space; the objective is the mean MPVPE.
model: ~/data/experiments/rsgm_posedflow_small_s10/run_0001
method: dposer
objective: mean
poses: 1000
n_trials: 80
params:
  t_max: {low: 0.003, high: 0.3, log: true}
  t_min_fraction: {low: 0.02, high: 0.9}
  lr: {low: 0.003, high: 0.3, log: true}
  start: [rest, mean, noise]
  prior_weight: {low: 0.01, high: 10.0, log: true}
  scale: [none, std]
first:
  - {t_max: 0.15, t_min_fraction: 0.3333, lr: 0.1, start: rest, prior_weight: 0.1, scale: none}  # DPoser's settings
  - {t_max: 0.05, t_min_fraction: 0.1, lr: 0.02, start: rest, prior_weight: 0.1, scale: none}    # our exploration
