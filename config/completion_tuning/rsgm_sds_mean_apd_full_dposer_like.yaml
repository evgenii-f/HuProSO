# DPoser's optimization on RSGM (score distillation, run(method="dposer"), hp.models.score_completion.rsgm_complete)
# on RSGM dposer_like (full data, DPoser's size), with two objectives: mean MPVPE (minimized) and APD (maximized).
# One of the six fronts of the comparison (RSGM x DPoser's method). The search space, fixed values and first trials of
# rsgm_sds_pareto (small c10, mean and best of 10), with the objective of the other studies of the comparison.
# Test: N points spanning the front, chosen by a rule fixed before the test.
model: ~/data/experiments/full/rsgm_posedflow_dposer_like_s10/run_0001
method: dposer
objective: mean_apd
poses: 1000
n_trials: 120
params:
  t_max: {low: 0.015, high: 0.15, log: true}
  t_min_fraction: {low: 0.1, high: 0.9}
  lr: {low: 0.02, high: 0.2, log: true}
  prior_weight: {low: 0.005, high: 1.0, log: true}
  steps_per_iter: [100, 200]
fixed:
  start: noise
  scale: std
first:  # those of rsgm_sds_pareto
  - {t_max: 0.0319, t_min_fraction: 0.592, lr: 0.0478, prior_weight: 0.0907, steps_per_iter: 100}
  - {t_max: 0.0319, t_min_fraction: 0.592, lr: 0.0478, prior_weight: 0.0907, steps_per_iter: 200}
  - {t_max: 0.0270, t_min_fraction: 0.867, lr: 0.0757, prior_weight: 0.0235, steps_per_iter: 100}
  - {t_max: 0.0270, t_min_fraction: 0.867, lr: 0.0757, prior_weight: 0.0235, steps_per_iter: 200}
  - {t_max: 0.08, t_min_fraction: 0.2, lr: 0.08, prior_weight: 0.05, steps_per_iter: 100}
  - {t_max: 0.12, t_min_fraction: 0.2, lr: 0.08, prior_weight: 0.05, steps_per_iter: 200}
