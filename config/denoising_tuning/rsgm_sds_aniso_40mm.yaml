# RSGM abl_residual_aniso (per-joint noise, c_j = 1 ... 42.8, c10) in DPoser's optimization, noise 40 mm,
# 100 validation sequences. The space of rsgm_sds_40mm.yaml (RSGM 512x4 c10, isotropic) with the noise window
# moved down: joint j gets the Brownian time c_j s(t), so the same t means about 12.7 times (geometric mean of c)
# more noise. The first trial is the isotropic best (trial 36: t_max 0.0595, t_min_fraction 0.387, weight 7.75, lr 0.0413, 67 steps, 18.69 mm)
# with t mapped so that a joint with c_j = 12.7 gets the noise of the isotropic model. At 40 mm the aniso model gave
# MPJPE 29.2 mm with the isotropic settings unchanged and 19.4 mm with the mapped t (isotropic abl_residual
# 18.63 mm at the isotropic best settings).
# Rule, fixed before the study: abl_residual_aniso is better in denoising if its best validation MPJPE is below that
# of abl_residual at the isotropic best settings (18.63 mm); no test before that.
model: ~/data/experiments/igso_speed/rsgm_posedflow_abl_residual_aniso_s10/run_0001
method: dposer
sigma: 0.04
sequences: 100
n_trials: 30
params:
  t_max: {low: 0.003, high: 0.1, log: true}
  t_min_fraction: {low: 0.05, high: 0.9}
  sds_weight: {low: 1.0, high: 100.0, log: true}
  lr: {low: 0.01, high: 0.1, log: true}
  steps_per_iter: [67, 133]
first:
  - {t_max: 0.0166, t_min_fraction: 0.387, sds_weight: 7.75, lr: 0.0413, steps_per_iter: 67}
