# Evaluation of a trained run:
#   python scripts/evaluate_model.py run=<run folder> split=test eval.n_generated=50000
# The report is written to <run>/metrics_<split>.json.
run: null                        # a folder with model.json and weights.pt (see hp.models.io), required
split: test                      # train | valid | test, the real poses to compare with
weights: weights                 # or weights_ema
# Contrast: real poses of OTHER subjects (the train split) stand in for a generator, and the same numbers are
# computed for them. That is what a model would score if it reproduced the training poses exactly, so compare the
# model with it. The same-set numbers (noise floor, baseline) are much smaller because neighbouring frames of a
# recording are nearly identical: they are no goals. See hp/evaluation/evaluate.py.
contrast: train                  # train | valid, or null for no contrast
contrast_rotations: null         # folder of the contrast poses; null: the same as data.rotations
output: null                     # null: <run>/metrics_<split>.json
device: auto                     # auto | cpu | mps | cuda:N
progress: true                   # a progress bar for every stage of the evaluation
data:
  rotations: null                # folder with the <Dataset>.pt files; null: amass_rotations of config/paths.yaml
  split: null                    # original | subset; null: amass_split of config/paths.yaml
eval:                            # the fields of hp.evaluation.EvalConfig
  n_wasserstein: 2000
  n_queries: 2000
  n_generated: 20000
  n_likelihood: 5000
  repeats: 3
  seed: 0
  sample_batch: 2000
  chunk: 20000
