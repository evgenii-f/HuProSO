# Settings of scripts/preprocess/compress_amass.py. Override on the command line, e.g. stride=10.
stride: 4                         # keep every n-th frame (4: 120 Hz -> 30 Hz)
crop_start_s: 0.0                 # seconds cut from the start of every sequence
crop_end_s: 0.0                   # seconds cut from the end of every sequence
output_dir: ~/data/amass_compressed
datasets: null                    # list such as [SSM, CMU]; null = every dataset in amass_raw
raw_dir: null                     # null = amass_raw of config/paths.yaml
num_workers: 4
overwrite: false                  # false: skip files that exist, refuse other parameters in output_dir
