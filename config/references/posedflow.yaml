  run: ~/data/experiments/factorial/rsgm_posedflow_fact_RDW_s10/run_0001
  settings: {lr: 0.06191246136496006, running_weight: 0.001012771994964723, steps: 200, ode_steps: 25, sampler: "heun", schedule: "edm"}
  source: rsgm_dflow_mean_apd_rdw_b0 t48
  minutes: 12.4
  study_hours: 15.1
  validation: {mean: 92.614, best: 51.015, apd: 6.508}
