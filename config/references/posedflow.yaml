# The references of scripts/evaluate.py all, PoseD-Flow's protocol. Fixed on 2026-11-23, networks without data weighting.
# Rule: per method and architecture (layers and width) the point of its study with the lowest mean MPVPE among those
# with APD >= 6.40 cm (D-Flow of small c10), on the 1000 validation poses of the studies, K = 10, means over the four
# occlusions: mean and best of 10 (mm), APD (cm). sets: the settings (also what `all` gives a new model of the same
# architecture) and the recorded numbers; front: the non-dominated points (mean, APD) of all the trials of these studies
# together; targets: the same rule for DPoser and PoseD-Flow, and their validation numbers on denoising.
# minutes: of the chosen trial, study_hours: of all its trials (the hosts differ; only an order of magnitude).
apd_floor: 6.40
unknown_architecture: timeres 1024x2
sets:
- method: inpaint
  architecture: timeres 512x2
  network: abl_residual c10
  run: ~/data/experiments/rsgm_posedflow_abl_residual_s10/run_0001
  settings: {steps: 400, guidance: 0.04934967328387599, resample: 5, replace: false, schedule: "edm"}
  source: rsgm_inpaint_mean_apd_residual t81
  minutes: 16.7
  study_hours: 5.1
  validation: {mean: 88.323, best: 49.182, apd: 6.413}
- method: inpaint
  architecture: timeres 1024x2
  network: fact_RDW c10
  run: ~/data/experiments/factorial/rsgm_posedflow_fact_RDW_s10/run_0001
  settings: {steps: 400, guidance: 0.03330060246460422, resample: 5, replace: false, schedule: "edm"}
